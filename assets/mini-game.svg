<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated visual banner</title>
  <desc id="desc">An automatic animated banner with orbiting lights, pulsing bars, and a moving scan line.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1500" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="0.52" stop-color="#1F2937" />
      <stop offset="1" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accent" x1="520" y1="120" x2="1080" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" />
      <stop offset="0.5" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.35 0 1 0 0 0.57 0 0 1 0 0.95 0 0 0 0.85 0" />
    </filter>
  </defs>

  <rect x="10" y="10" width="1580" height="400" rx="30" fill="url(#bg)" stroke="#374151" stroke-width="4" />
  <rect x="34" y="34" width="1532" height="352" rx="24" fill="none" stroke="#94A3B8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 12" />

  <g opacity="0.15">
    <line x1="0" y1="92" x2="1600" y2="92" stroke="#93C5FD" stroke-width="2" />
    <line x1="0" y1="172" x2="1600" y2="172" stroke="#A78BFA" stroke-width="2" />
    <line x1="0" y1="252" x2="1600" y2="252" stroke="#60A5FA" stroke-width="2" />
    <line x1="0" y1="332" x2="1600" y2="332" stroke="#C4B5FD" stroke-width="2" />
  </g>

  <text x="72" y="104" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3">AUTOPLAY VISUAL</text>
  <text x="72" y="146" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="18">Moving elements, no interaction required.</text>

  <g transform="translate(1020 78)">
    <rect x="0" y="0" width="468" height="240" rx="28" fill="#0B1220" stroke="#475569" stroke-width="2" />
    <rect x="22" y="22" width="424" height="196" rx="20" fill="#111827" stroke="#334155" stroke-width="2" />

    <g filter="url(#glow)">
      <circle cx="236" cy="120" r="56" fill="url(#accent)" opacity="0.18">
        <animate attributeName="r" values="56;70;56" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="236" cy="120" r="20" fill="#8B5CF6">
        <animate attributeName="r" values="20;26;20" dur="1.6s" repeatCount="indefinite" />
      </circle>

      <g>
        <circle cx="236" cy="48" r="8" fill="#C4B5FD" />
        <circle cx="236" cy="192" r="8" fill="#93C5FD" />
        <circle cx="164" cy="120" r="8" fill="#60A5FA" />
        <circle cx="308" cy="120" r="8" fill="#8B5CF6" />
        <animateTransform attributeName="transform" type="rotate" values="0 236 120;360 236 120" dur="10s" repeatCount="indefinite" />
      </g>

      <rect x="70" y="72" width="22" height="96" rx="10" fill="#60A5FA">
        <animate attributeName="height" values="96;46;96" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="72;97;72" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="108" y="52" width="22" height="136" rx="10" fill="#8B5CF6">
        <animate attributeName="height" values="136;74;136" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="52;83;52" dur="1.8s" repeatCount="indefinite" />
      </rect>
      <rect x="346" y="64" width="22" height="112" rx="10" fill="#93C5FD">
        <animate attributeName="height" values="112;56;112" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y" values="64;92;64" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="384" y="84" width="22" height="72" rx="10" fill="#C4B5FD">
        <animate attributeName="height" values="72;118;72" dur="1.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="84;61;84" dur="1.9s" repeatCount="indefinite" />
      </rect>
    </g>

    <rect x="54" y="204" width="360" height="8" rx="4" fill="#1F2937" />
    <rect x="54" y="204" width="128" height="8" rx="4" fill="url(#accent)">
      <animate attributeName="width" values="128;296;128" dur="3.2s" repeatCount="indefinite" />
    </rect>

    <rect x="40" y="28" width="388" height="4" fill="#E5E7EB" opacity="0.08">
      <animate attributeName="x" values="40;40;40" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="30" width="388" height="2" fill="#FFFFFF" opacity="0.28">
      <animate attributeName="y" values="30;180;30" dur="2.7s" repeatCount="indefinite" />
    </rect>
  </g>

  <g transform="translate(84 202)">
    <rect x="0" y="0" width="840" height="132" rx="22" fill="#0B1220" stroke="#334155" stroke-width="2" />
    <text x="30" y="44" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Live loop</text>
    <text x="30" y="80" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="18">Blue, gray, and violet motion.</text>
    <text x="30" y="110" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="18">Auto-animated banner for the GitHub profile.</text>
  </g>
</svg>
